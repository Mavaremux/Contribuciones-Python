<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta de Amor</title>
    <style>
        body {
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .heart {
            color: #e74c3c;
            font-size: 50px;
        }
        .flower {
            color: #ffb3ff;
            font-size: 50px;
        }
        .letter {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #ff69b4;
        }
        p {
            color: #555;
            font-size: 18px;
        }
        .footer {
            margin-top: 30px;
            color: #3498db;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="letter">
        <h1>💖 Para mi princesa 💖</h1>
        <p>Eres muy especial mi amor, estoy para ti para siempre que me necesites, te amo muchisimo.</p>
        <p>Tu sonrisa me motiva y me encantas mmucho.</p>
        <p>Te amo mucho mas de lo que crees, te quiero mucho y mandame el audio</p>
        <div class="heart">❤️</div>
        <div class="flower">🌸</div>
        <div class="heart">❤️</div>
        <p class="footer">De tu amor, Ale</p>
    </div>
</body>
</html>
